# /etc/nginx/sites-available/shopmate  (then: ln -s ../sites-available/shopmate /etc/nginx/sites-enabled/)
server {
    listen 80;
    server_name your-domain.example;          # or the server's public IP
    root /var/www/shopmate/public;
    index index.php;

    charset utf-8;
    client_max_body_size 4m;

    # Compress text responses (HTML, CSS, JS, JSON): smaller pages load faster on mobile data.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # CSS/JS/fonts carry a ?v= version in their URL, so browsers may cache them for a long time.
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known) { deny all; }
}
