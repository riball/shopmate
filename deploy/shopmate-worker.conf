# /etc/supervisor/conf.d/shopmate-worker.conf
# Keeps the queue worker (which runs searches) alive and restarts it if it crashes.
# After editing: sudo supervisorctl reread && sudo supervisorctl update
[program:shopmate-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/shopmate/artisan queue:work --sleep=1 --tries=2 --max-time=3600
directory=/var/www/shopmate
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=200
redirect_stderr=true
stdout_logfile=/var/log/shopmate-worker.log
